services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: campuscore
      POSTGRES_PASSWORD: campuscore
      POSTGRES_DB: campuscore
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the campuscore_test database used by pytest (first start only).
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscore"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
